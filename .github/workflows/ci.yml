name: Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ChunkSurvivalPlugins.sln

      - name: Build
        run: dotnet build ChunkSurvivalPlugins.sln --configuration Release --no-restore --nologo

      - name: Package plugins
        shell: pwsh
        run: ./tools/package-all-plugins.ps1 -Configuration Release -NoBuild

      - name: Upload plugin packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chunk-survival-plugins
          path: artifacts/plugins/*.zip
          if-no-files-found: error
          retention-days: 14
